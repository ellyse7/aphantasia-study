<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cognitive Imagery & Spatial Memory Study</title>
  <script src="https://unpkg.com/jspsych@7.3.4"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-canvas-keyboard-response@1.1.3"></script>
  <link href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css" rel="stylesheet" type="text/css" />
  <style>
    body { background-color: #222222; color: #ffffff; font-family: Arial, sans-serif; }
    .jspsych-content { max-width: 900px; }
    .highlight-cyan { color: #00ffff; font-weight: bold; }
    .prompt-box { font-size: 22px; line-height: 1.5; margin-bottom: 30px; }
    .key-guide { font-size: 18px; color: #00ffff; margin-top: 20px; }
  </style>
</head>
<body></body>
<script>
  // ============================================================================
  // 1. ANONYMOUS ID & IRB SETUP (ZERO IDENTIFIABLE INFO)
  // ============================================================================
  const anonId = "ANON_" + Math.floor(100000 + Math.random() * 900000);
  let vviqTotal = 0;
  let cogGroup = "Pending";

  const jsPsych = initJsPsych({
    on_finish: function() {
      // Classify participant
      if (vviqTotal <= 20) cogGroup = "Aphantasic";
      else if (vviqTotal >= 60) cogGroup = "Visualizer";
      else cogGroup = "Typical/Intermediate";

      // Add summary columns to all rows and export clean CSV
      jsPsych.data.addProperties({
        Anonymous_ID: anonId,
        VVIQ_Total_Score: vviqTotal,
        Cognitive_Group: cogGroup
      });

      // Automatically download CSV for participant/researcher
      jsPsych.data.get().localSave('csv', `${anonId}_results.csv`);
    }
  });

  const timeline = [];

  // ============================================================================
  // INFORMED CONSENT SCREEN (IRB COMPLIANT)
  // ============================================================================
  timeline.push({
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `
      <h2>Informed Consent & Anonymous Participation</h2>
      <div class="prompt-box" style="text-align:left; font-size:18px;">
        <p>You are invited to participate in a cognitive science research study examining visual imagery and memory.</p>
        <ul>
          <li>Your participation is completely voluntary and anonymous.</li>
          <li><strong>No personally identifiable information</strong> (name, age, IP address, or timestamp) is collected.</li>
          <li>You may exit at any time by closing this browser tab.</li>
        </ul>
        <p>By pressing <strong>[Y]</strong>, you confirm that you understand and consent to participate.</p>
      </div>
      <div class="key-guide">Press [Y] to Consent and Begin</div>
    `,
    choices: ['y'],
    data: { Phase: 'Consent' }
  });

  // ============================================================================
  // PHASE 1: VVIQ SCREENING (16 ITEMS)
  // ============================================================================
  timeline.push({
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `
      <h2>Phase 1: Visual Imagery Questionnaire</h2>
      <div class="prompt-box">
        <p>For each scenario, rate how vivid your mental image is using keys <strong>1 to 5</strong> on your keyboard:</p>
        <p style="font-size:18px; text-align:left;">
          <strong>1</strong> = No image at all (you only "know" you are thinking of the object)<br>
          <strong>2</strong> = Vague and dim<br>
          <strong>3</strong> = Moderately clear and vivid<br>
          <strong>4</strong> = Clear and reasonably vivid<br>
          <strong>5</strong> = Perfectly clear and as vivid as real vision
        </p>
      </div>
      <div class="key-guide">Press [SPACE] to start Phase 1</div>
    `,
    choices: [' '],
    data: { Phase: 'Instructions_VVIQ' }
  });

  const vviqPrompts = [
    "1. Think of a relative or friend you see frequently: The exact contour of their face, head, shoulders, and body.",
    "2. The characteristic poses of their head, attitudes of body, etc.",
    "3. The precise carriage, length of step, etc. in walking.",
    "4. The different colors worn in some familiar clothes.",
    "5. Visualize a rising sun: The sun is rising above the horizon into a hazy sky.",
    "6. The sky clears and surrounds the sun with blueness.",
    "7. Clouds. A storm blows up, with flashes of lightning.",
    "8. A rainbow appears.",
    "9. Think of the front of a shop you often go to: The overall appearance of the shop from the opposite side of the road.",
    "10. A window display including colors, shapes, and details of individual items for sale.",
    "11. You are near the entrance. The color, shape, and details of the door.",
    "12. You enter the shop and go to the counter. The counter assistant serves you. Money changes hands.",
    "13. Think of a country scene involving trees, mountains, and a lake: The contours of the landscape.",
    "14. The color and shape of the trees.",
    "15. The color and shape of the lake.",
    "16. A strong wind blows on the trees and on the lake causing waves."
  ];

  vviqPrompts.forEach((promptText, index) => {
    timeline.push({
      type: jsPsychHtmlKeyboardResponse,
      stimulus: `
        <div class="prompt-box">${promptText}</div>
        <div class="key-guide">[1] No Image &nbsp;&nbsp;|&nbsp;&nbsp; [2] Dim &nbsp;&nbsp;|&nbsp;&nbsp; [3] Moderate &nbsp;&nbsp;|&nbsp;&nbsp; [4] Clear &nbsp;&nbsp;|&nbsp;&nbsp; [5] Perfectly Vivid</div>
      `,
      choices: ['1', '2', '3', '4', '5'],
      data: { Phase: 'VVIQ', Trial_Num: index + 1 },
      on_finish: function(data) {
        const rating = parseInt(data.response);
        vviqTotal += rating;
        data.Participant_Response = rating;
      }
    });
  });

  // ============================================================================
  // PHASE 2: TASK A - SPATIAL ROTATION MATRIX
  // ============================================================================
  timeline.push({
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `
      <h2>Phase 2: Spatial Rotation Task</h2>
      <div class="prompt-box">
        <p>You will see two geometric shapes side-by-side. The shape on the right is rotated.</p>
        <p>Decide if the right shape is the <strong>EXACT SAME</strong> shape rotated, or a <strong>MIRROR IMAGE</strong>.</p>
        <p><span class="highlight-cyan">[S]</span> = SAME &nbsp;&nbsp;&nbsp;&nbsp; | &nbsp;&nbsp;&nbsp;&nbsp; <span class="highlight-cyan">[M]</span> = MIRROR IMAGE</p>
      </div>
      <div class="key-guide">Respond as quickly and accurately as possible. Press [SPACE] to begin.</div>
    `,
    choices: [' '],
    data: { Phase: 'Instructions_TaskA' }
  });

  function drawAsymmetricShape(ctx, centerX, centerY, angleDeg, isMirror) {
    ctx.save();
    ctx.translate(centerX, centerY);
    ctx.rotate((angleDeg * Math.PI) / 180);
    if (isMirror) ctx.scale(-1, 1);

    // L-block asymmetric polygon
    ctx.beginPath();
    ctx.moveTo(-60, -60);
    ctx.lineTo(-20, -60);
    ctx.lineTo(-20, 20);
    ctx.lineTo(50, 20);
    ctx.lineTo(50, 60);
    ctx.lineTo(-60, 60);
    ctx.closePath();

    ctx.fillStyle = '#4682B4';
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#FFFFFF';
    ctx.stroke();
    ctx.restore();
  }

  const angles = [0, 45, 90, 135, 180];
  let taskATrials = [];
  angles.forEach(ang => {
    taskATrials.push({ angle: ang, isMirror: false, corr: 's' });
    taskATrials.push({ angle: ang, isMirror: true, corr: 'm' });
  });
  taskATrials = jsPsych.randomization.shuffle(taskATrials);

  taskATrials.forEach((trial, index) => {
    // Fixation
    timeline.push({
      type: jsPsychHtmlKeyboardResponse,
      stimulus: '<div style="font-size:48px;">+</div>',
      choices: "NO_KEYS",
      trial_duration: 500
    });

    // Rotation Stimulus
    timeline.push({
      type: jsPsychCanvasKeyboardResponse,
      canvas_size: [400, 800],
      stimulus: function(c) {
        const ctx = c.getContext('2d');
        drawAsymmetricShape(ctx, 220, 200, 0, false);
        drawAsymmetricShape(ctx, 580, 200, trial.angle, trial.isMirror);
      },
      prompt: '<div class="key-guide">[S] = Same &nbsp;&nbsp;&nbsp;&nbsp;|&nbsp;&nbsp;&nbsp;&nbsp; [M] = Mirror</div>',
      choices: ['s', 'm'],
      data: {
        Phase: 'TaskA_Rotation',
        Trial_Num: index + 1,
        Condition_Detail: `Angle_${trial.angle}`,
        Stimulus_Info: `Mirror_${trial.isMirror}`,
        Correct_Answer: trial.corr
      },
      on_finish: function(data) {
        data.Participant_Response = data.response;
        data.Accuracy = (data.response === trial.corr) ? 1 : 0;
        data.Reaction_Time_ms = Math.round(data.rt);
      }
    });
  });

  // ============================================================================
  // PHASE 3: TASK B - SEMANTIC TAGGING ON IDENTICAL OBJECTS ("BLANK PENS")
  // ============================================================================
  timeline.push({
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `
      <h2>Phase 3: Spatial-Semantic Feature Recall</h2>
      <div class="prompt-box">
        <p>You will see a grid of <strong>6 IDENTICAL white pens</strong>, each labeled with a descriptive word (e.g., "RED", "STRIPED").</p>
        <p>Memorize <strong>which word belongs to which spatial location</strong>.</p>
        <p>After a brief flash, one grid spot will be highlighted and you will identify its descriptive tag using keys <strong>[1] to [4]</strong>.</p>
      </div>
      <div class="key-guide">Press [SPACE] to begin Phase 3</div>
    `,
    choices: [' '],
    data: { Phase: 'Instructions_TaskB' }
  });

  const gridCoords = [
    { x: 200, y: 120 }, { x: 400, y: 120 }, { x: 600, y: 120 },
    { x: 200, y: 310 }, { x: 400, y: 310 }, { x: 600, y: 310 }
  ];

  const wordPool = [
    "RED", "STRIPED", "METALLIC", "RIDGED", "GLOSSY", "HEAVY",
    "BLUE", "DOTTED", "WOODEN", "MATTE", "HOLLOW", "CURVED"
  ];

  for (let t = 0; t < 8; t++) {
    const trialWords = jsPsych.randomization.sampleWithoutReplacement(wordPool, 6);
    const targetIdx = Math.floor(Math.random() * 6);
    const targetWord = trialWords[targetIdx];

    const distractors = jsPsych.randomization.sampleWithoutReplacement(
      trialWords.filter(w => w !== targetWord), 3
    );
    const options = jsPsych.randomization.shuffle([...distractors, targetWord]);
    const corrKey = (options.indexOf(targetWord) + 1).toString();

    // 1. Encoding Phase (3000ms)
    timeline.push({
      type: jsPsychCanvasKeyboardResponse,
      canvas_size: [440, 800],
      stimulus: function(c) {
        const ctx = c.getContext('2d');
        gridCoords.forEach((pos, i) => {
          // Draw identical blank white pen
          ctx.fillStyle = '#FFFFFF';
          ctx.fillRect(pos.x - 12, pos.y - 55, 24, 110);
          ctx.strokeStyle = '#000000';
          ctx.lineWidth = 2;
          ctx.strokeRect(pos.x - 12, pos.y - 55, 24, 110);

          // Draw descriptive tag underneath
          ctx.fillStyle = '#FFFF00';
          ctx.font = 'bold 18px Arial';
          ctx.textAlign = 'center';
          ctx.fillText(trialWords[i], pos.x, pos.y + 80);
        });
      },
      choices: "NO_KEYS",
      trial_duration: 3000
    });

    // 2. Visual Mask Phase (1500ms)
    timeline.push({
      type: jsPsychHtmlKeyboardResponse,
      stimulus: '<div style="font-size:42px; color:#888; letter-spacing:10px;">### ### ###<br>### ### ###<br>### ### ###</div>',
      choices: "NO_KEYS",
      trial_duration: 1500
    });

    // 3. Probe Phase
    timeline.push({
      type: jsPsychCanvasKeyboardResponse,
      canvas_size: [440, 800],
      stimulus: function(c) {
        const ctx = c.getContext('2d');
        gridCoords.forEach((pos, i) => {
          ctx.strokeStyle = (i === targetIdx) ? '#00FFFF' : '#555555';
          ctx.lineWidth = (i === targetIdx) ? 4 : 1;
          ctx.strokeRect(pos.x - 16, pos.y - 60, 32, 120);
        });
      },
      prompt: `
        <div style="font-size:20px; margin-bottom:10px;">Which descriptive tag belonged to the highlighted pen?</div>
        <div class="key-guide">[1] ${options[0]} &nbsp;&nbsp;&nbsp; [2] ${options[1]} &nbsp;&nbsp;&nbsp; [3] ${options[2]} &nbsp;&nbsp;&nbsp; [4] ${options[3]}</div>
      `,
      choices: ['1', '2', '3', '4'],
      data: {
        Phase: 'TaskB_Semantic',
        Trial_Num: t + 1,
        Condition_Detail: `Grid_Pos_${targetIdx}`,
        Stimulus_Info: `Target_${targetWord}`,
        Correct_Answer: corrKey
      },
      on_finish: function(data) {
        data.Participant_Response = data.response;
        data.Accuracy = (data.response === corrKey) ? 1 : 0;
        data.Reaction_Time_ms = Math.round(data.rt);
      }
    });
  }

  // ============================================================================
  // COMPLETION SCREEN
  // ============================================================================
  timeline.push({
    type: jsPsychHtmlKeyboardResponse,
    stimulus: function() {
      let groupLabel = "Typical/Intermediate";
      if (vviqTotal <= 20) groupLabel = "Aphantasic";
      else if (vviqTotal >= 60) groupLabel = "Visualizer";

      return `
        <h2>Experiment Complete!</h2>
        <div class="prompt-box">
          <p>Anonymous Session Code: <span class="highlight-cyan">${anonId}</span></p>
          <p>Your VVIQ Score: <span class="highlight-cyan">${vviqTotal}</span> (${groupLabel})</p>
          <p style="font-size:16px; color:#cccccc;">Your anonymous data file has been generated. Thank you for contributing to this research!</p>
        </div>
      `;
    },
    choices: "NO_KEYS"
  });

  jsPsych.run(timeline);
</script>
</html>
